name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Lint, Typecheck, Test, Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test:coverage
        env:
          # Tests must never call the real API — Gemini client is mocked
          GEMINI_API_KEY: test-key-never-used

      - name: Build
        run: npm run build
        env:
          # Build requires env var to be set (but won't call API during build)
          GEMINI_API_KEY: test-key-never-used
